name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3

  test:
    # Apple Silicon runner: the NEON kernel is arm64-only and MLX needs macOS.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Build NEON kernel
        run: bash siliconfer/kernels/neon/build_kernel.sh
      - name: Unit tests (no model download)
        run: .venv/bin/python -m pytest tests -q
